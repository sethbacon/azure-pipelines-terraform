# zizmor configuration — https://docs.zizmor.sh/configuration/
# Documented, intentional exceptions. Every other finding fails CI.
# Ignores are scoped to the exact line:column zizmor reports today (#686) --
# not the whole file -- so a future edit that introduces a genuinely new
# instance of either rule in release.yml for an unrelated reason is still
# surfaced for review instead of being silently swallowed by a blanket
# per-file ignore. Re-verify these line numbers with
# `zizmor --no-config --format plain .github/workflows/release.yml` if
# release.yml's setup-node/action-gh-release steps ever move.
#
# They moved on 2026-08-20: adding harden-runner and timeout-minutes to every
# job shifted every line below the first insertion, and all five ignores went
# stale at once -- the four cache-poisoning findings resurfaced and failed CI on
# a change that touched none of the steps involved. The line numbers below were
# re-derived with the command above, not adjusted by hand.
#
#
# They moved again on 2026-08-24, for the same reason and by the same mechanism:
# adding a `permissions:` block to release.yml's `ci` job -- required so the
# workflow-security-record job inside unit-test.yml does not exceed its caller's
# ceiling -- inserted 8 lines and shifted every ignore below it by exactly 8.
# All five went stale together and the four cache-poisoning findings resurfaced,
# on a change that touched none of the setup-node steps. Re-derived with the
# command above rather than adjusted by hand.
#
# They moved again on 2026-08-31 (apt#1032): adding the "Validate workflow_dispatch
# tag shape" step to the guard job inserted 21 lines above every ignore below,
# shifting all five by exactly 21. Re-derived with the command above rather than
# adjusted by hand.
#
# They moved again on 2026-09-01 (apt#1028): flipping guard/sbom-and-sign/
# publish-marketplace to egress-policy: block with allowed-endpoints lists
# inserted a different number of lines above each ignore (they are no longer a
# uniform offset apart, since the inserted comment+allowlist blocks differ in
# length per job). Re-derived with the command above rather than adjusted by hand.
# This is the cost of line-scoped ignores, and it is the intended cost: the
# alternative is a per-file ignore that would have silently swallowed a genuinely
# new finding. A suppression that breaks loudly when the file moves is doing its
# job.
rules:
  cache-poisoning:
    ignore:
      # The release pipeline's 4 setup-node steps do not enable dependency
      # caching (no `cache:` input), so there is no cached artifact to poison.
      # zizmor flags setup-node defensively in any artifact-publishing workflow.
      - release.yml:217:9
      - release.yml:250:9
      - release.yml:317:9
      - release.yml:599:9
  superfluous-actions:
    ignore:
      # softprops/action-gh-release is used deliberately for its multi-file
      # glob upload + release-notes generation; `gh release` is not equivalent.
      - release.yml:530:15
