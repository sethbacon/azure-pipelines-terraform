version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: monday
      time: "09:00"
      timezone: UTC
    cooldown:
      default-days: 7
    allow:
      - dependency-type: "direct"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Minor/patch Action bumps are low-risk and numerous; batch them into one
      # PR so a solo maintainer isn't triaging dozens of near-identical bumps
      # (issue #639). Majors stay ungrouped for individual review.
      actions-minor-patch:
        update-types: ["minor", "patch"]

  # npm — every task, as one entry
  - package-ecosystem: "npm"
    # One entry, not one per task, because `group-by: dependency-name` only
    # groups across the directories of a single entry. scripts/check-task-list.js
    # reads this list, so a task missing from it fails CI.
    directories:
      - "/Tasks/TerraformTask/TerraformTaskV5"
      - "/Tasks/TerraformInstaller/TerraformInstallerV1"
      - "/Tasks/TerraformProviderMirror/TerraformProviderMirrorV1"
      - "/Tasks/TerraformModulePublish/TerraformModulePublishV1"
      - "/Tasks/PolicyAgentInstaller/PolicyAgentInstallerV1"
      - "/Tasks/TerraformPolicyCheck/TerraformPolicyCheckV1"
      - "/Tasks/TerraformDriftReport/TerraformDriftReportV1"
      - "/Tasks/TerraformDocsInstaller/TerraformDocsInstallerV1"
      - "/Tasks/TerraformDocs/TerraformDocsV1"
      - "/Tasks/Markdown2Html/Markdown2HtmlV1"
      - "/Tasks/PublishKbArticle/PublishKbArticleV1"
    schedule:
      interval: "weekly"
      day: monday
      time: "09:00"
      timezone: UTC
    cooldown:
      default-days: 7
    allow:
      - dependency-type: "direct"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One pull request per dependency, covering every task that uses it,
      # instead of one per task: an azure-pipelines-task-lib release arrives as a
      # single PR for all eleven tasks, so they cannot drift onto different
      # versions. Per-task entries turned one week's updates into 28 PRs on
      # 2026-11-16, eleven of them the same task-lib bump. Runtime dependencies
      # still get a PR each, as #639 wanted, and majors stay out via `allow`.
      task-dependencies:
        patterns: ["*"]
        group-by: dependency-name
    ignore:
      # ts-node (the test transpiler) does not support TypeScript 6 yet.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # npm — root (build tooling)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: monday
      time: "09:00"
      timezone: UTC
    cooldown:
      default-days: 7
    allow:
      - dependency-type: "direct"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # tfx-cli 0.23.3 pulls in lodash with HIGH advisories; pinned to 0.23.2.
      # Bounded (not open-ended) so Dependabot resumes proposing updates once a
      # fixed 0.24.x+ release exists, instead of ignoring tfx-cli forever.
      - dependency-name: "tfx-cli"
        versions: [">=0.23.3", "<0.24.0"]
