---
name: PR Checks

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  conventional-title:
    name: Conventional PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check PR title follows Conventional Commits
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert
            deps
            security
          requireScope: false
          subjectPattern: ^.+$
          subjectPatternError: >-
            The PR title must have a non-empty description after the type
            (e.g. "feat: add OCI backend support", not "feat:").

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9 # v4.7.1
        with:
          # Moderate-severity new/changed dependencies are blocked at PR time too
          # (not just high/critical), matching the root/per-task npm audit gates.
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

  # Backstop merge gate for the per-task Minor bumps. release-pr-minor-bumps.yml
  # applies the bumps automatically on the Release PR; this gate fails the PR if
  # they are somehow still missing (e.g. the auto-bump workflow was broken or
  # disabled), so a Release PR can never merge without them and reach the too-late
  # tag-time guard in release.yml. This job ALWAYS runs (no job-level `if:`) so it
  # reports a definite status and can be a required check without ever getting
  # stuck "Expected" — the release-vs-normal-PR branching is inside the steps.
  release-pr-minor-bumps:
    name: Release PR Minor Bumps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Skip for non-release PRs
        if: ${{ ! startsWith(github.event.pull_request.head.ref, 'release-please--') }}
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "Head ref '${HEAD_REF}' is not a release-please branch; the per-task Minor-bump gate only applies to Release PRs. Skipping (this gate always runs so it can be a required check)."
      # For a release PR, check out the default pull_request context (the merge
      # ref = main + this PR) with full history and tags, then run the check.
      # Comparing the newest v*.*.* tag against that merge ref is exactly the
      # right comparison: it is what main would look like once this PR merges.
      - name: Checkout (release PRs only)
        if: ${{ startsWith(github.event.pull_request.head.ref, 'release-please--') }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Verify per-task Minor bumps
        if: ${{ startsWith(github.event.pull_request.head.ref, 'release-please--') }}
        run: node scripts/check-minor-bumps.js

  # ── The merged commit has to be readable by release-please ─────────────
  # release-please chooses what to release by parsing the commits on main
  # with a strict reading of the Conventional Commits grammar. A message it
  # cannot parse is not an error to it: it logs `commit could not be parsed`
  # at debug level, reports success, and drops the commit. That change then
  # gets no changelog entry and no version bump, and never will -- every
  # later run re-reads the same commit and skips it again.
  #
  # This is not hypothetical. terraform-state-manager-backend#405, a
  # dependency migration that cleared seven advisories, merged with a body
  # line that happened to begin with `WithArgs(pq.Array(...))`. The grammar
  # reads a line starting with `name(` as a structured token, so its
  # brackets have to be flat and closed, and nested ones void the whole
  # commit. The same text one word further along the line is ordinary prose
  # and parses cleanly. Whether that release got cut came down to where the
  # paragraph wrapped.
  #
  # Its sibling repository made the identical change and released normally,
  # on the same config and the same action version. Nothing in CI could tell
  # the two apart, because a PR title check reads only the title and both
  # titles were correct.
  release-please-can-read-the-commit:
    name: release-please can read the merged commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install the parser release-please uses
        working-directory: .github/commit-message-check
        run: npm ci

      - name: Parse the commit this PR would squash into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits" \
            --jq '.[] | {sha: .sha, message: .commit.message, parents: (.parents | length)}' \
            > commits.ndjson

          node .github/commit-message-check/verify.mjs commits.ndjson
