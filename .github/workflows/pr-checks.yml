---
name: PR Checks

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  conventional-title:
    name: Conventional PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # hardening-exception: egress-audit — this job calls the GitHub API;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check PR title follows Conventional Commits
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert
            deps
            security
          requireScope: false
          subjectPattern: ^.+$
          subjectPatternError: >-
            The PR title must have a non-empty description after the type
            (e.g. "feat: add OCI backend support", not "feat:").

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      # hardening-exception: egress-audit — this job queries the GitHub advisory API
      #   and clones this repository; harden-runner has never run in this repository,
      #   so no endpoint baseline exists and a block policy written without one fails
      #   closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9 # v4.7.1
        with:
          # Moderate-severity new/changed dependencies are blocked at PR time too
          # (not just high/critical), matching the root/per-task npm audit gates.
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

  # Backstop merge gate for the per-task Minor bumps. release-pr-minor-bumps.yml
  # applies the bumps automatically on the Release PR; this gate fails the PR if
  # they are somehow still missing (e.g. the auto-bump workflow was broken or
  # disabled), so a Release PR can never merge without them and reach the too-late
  # tag-time guard in release.yml. This job ALWAYS runs (no job-level `if:`) so it
  # reports a definite status and can be a required check without ever getting
  # stuck "Expected" — the release-vs-normal-PR branching is inside the steps.
  release-pr-minor-bumps:
    name: Release PR Minor Bumps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # hardening-exception: egress-audit — this job clones this repository;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Skip for non-release PRs
        if: ${{ ! startsWith(github.event.pull_request.head.ref, 'release-please--') }}
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "Head ref '${HEAD_REF}' is not a release-please branch; the per-task Minor-bump gate only applies to Release PRs. Skipping (this gate always runs so it can be a required check)."
      # For a release PR, check out the default pull_request context (the merge
      # ref = main + this PR) with full history and tags, then run the check.
      # Comparing the newest v*.*.* tag against that merge ref is exactly the
      # right comparison: it is what main would look like once this PR merges.
      - name: Checkout (release PRs only)
        if: ${{ startsWith(github.event.pull_request.head.ref, 'release-please--') }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Verify per-task Minor bumps
        if: ${{ startsWith(github.event.pull_request.head.ref, 'release-please--') }}
        run: node scripts/check-minor-bumps.js

  # ── Breaking-change declarations survive the squash ────────────────────
  # This repository squash-merges with
  # `squash_merge_commit_message=COMMIT_MESSAGES` (verified on the live
  # repository, not assumed), so every commit body in a pull request is
  # concatenated into ONE merge commit. release-please then keeps only the
  # FIRST `BREAKING CHANGE:` footer of that commit, and reads a `!` marker only
  # from its header. A second declaration anywhere in the PR is dropped in
  # silence: the change ships with no changelog entry, no upgrade note, and
  # nothing failing to say so.
  #
  # WHAT COUNTS is release-please's rule, not the spec's, and the two spellings
  # of the token are NOT symmetric there. Verified against release-please
  # 17.11.1's own parser rather than its documentation: `BREAKING CHANGE:`, with
  # a space, is read only at the START of a line, while the hyphenated spelling
  # is ALSO matched by an unanchored regex over the commit body -- mid-sentence,
  # indented, inside a fenced code block, even inside a longer word -- with the
  # remainder of that line taken as the description.
  #
  # This guard used to count only line-anchored matches, so it UNDER-counted
  # against release-please and passed commits release-please treats as breaking.
  # abacdb5 in azure-pipelines-terraform, the commit that ADDED the guard there,
  # is the case: a sentence in its body NAMING the hyphenated spelling made
  # release-please propose a MAJOR bump over 1.14.4 with a changelog entry
  # reading "` spelling". The guard counted it 0.
  #
  # So the count below is release-please's count -- no more, and no less, since a
  # guard that rejects legitimate prose is one people route around and then
  # delete. On top of it the guard rejects a hyphenated token found off the start
  # of a line at all: that is never a declaration anybody WROTE, and it always
  # buys a major version bump nobody asked for.
  #
  # This is not hypothetical. terraform-registry-backend v4.0.0 published with
  # two undocumented breaking changes this way -- one of them 403s any CI job
  # calling `/auth/refresh` with an API key -- and
  # terraform-state-manager-backend lost three from a PR that declared four,
  # caught only by reading the release notes line by line before the cut.
  #
  # It costs more here than in a service repository. This extension publishes to
  # the VS Marketplace, where a pipeline author's only signal that a task
  # changed incompatibly is the release notes release-please generates from
  # these footers; and ADO agents cache tasks by Major.Minor, so the change
  # reaches a running agent on its own schedule with nothing to read.
  #
  # Splitting the footers across separate commits does not help; the squash
  # concatenates them back. One merged commit can announce exactly one breaking
  # change. Either open one PR per breaking change, or combine them into a
  # single footer and write each one up in the upgrade guide.
  #
  # This is the CROSS-COMMIT half of the release-parsing pair. Its sibling
  # below, `release-please can read the merged commit`, builds the ONE message
  # this PR would squash into main and asks whether release-please's parser can
  # read it at all; this job counts declarations ACROSS the commits being
  # concatenated. Neither subsumes the other: a perfectly parseable squash can
  # still swallow a second footer, and a single-footer PR can still be
  # unparseable.
  #
  # PROVENANCE. Ported (#966) from `azure-pipelines-release-docs`, which took it
  # from `terraform-registry-backend` -- carried there together with
  # terraform-registry-frontend, terraform-state-manager-{backend,frontend} and
  # terraform-suite-identity -- and added the self-test named below.
  #
  # MUTATION-PROVED, but no longer here. The guard was a 128-line shell body
  # duplicated across NINE repositories -- which is why one regex mistake existed
  # in nine places at once and took nine pull requests to correct -- so it now
  # lives once as a composite action in 4cloudguru/shared-workflows, with its
  # 16-case test beside it in that repository's self-check.
  #
  # The test still EXTRACTS the script from the action rather than copying it: a
  # copy drifts from the thing it claims to prove, which is the same defect one
  # level up.
  #
  # This stays a composite action called as a STEP rather than a reusable
  # workflow, so the job keeps its name and this check keeps reporting as
  # "Breaking-change footers survive the squash". A reusable workflow reports as
  # <caller-job-id> / <called-job-name>, and this context is required in
  # azure-pipelines-release-docs.
  #
  # A NEW required context has to be added to main's branch protection by hand:
  # "Breaking-change footers survive the squash". Until that is done this job
  # reports on every pull request without blocking one -- which is also the
  # state of `release-please can read the merged commit` below, the other half
  # of the pair, and both should be promoted together.
  breaking-change-footers:
    name: Breaking-change footers survive the squash
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      # This job runs only shell, so before this step it reached no action at
      # all -- and a job that never runs an action never runs harden-runner
      # either. The gate reports that as an egress finding rather than treating
      # "no actions" as "nothing to protect": the shell here still talks to the
      # GitHub API with a token.
      #
      # hardening-exception: egress-audit — this job calls the GitHub API to count
      #   breaking-change declarations across the PR's commits and runs no other
      #   network operation; harden-runner has never run in this repository, so no
      #   endpoint baseline exists and a block policy written without one fails
      #   closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      # The guard is 128 lines of shell that was duplicated across NINE
      # repositories, which is why one regex mistake existed in nine places at
      # once and took nine pull requests to correct. It now lives once, in
      # 4cloudguru/shared-workflows, with its test beside it.
      #
      # A composite ACTION, not a reusable workflow: a reusable workflow reports
      # as <caller-job-id> / <called-job-name>, which would rename this check.
      # Called as a step, the job keeps its name and the context keeps reporting
      # as "Breaking-change footers survive the squash", so no branch protection
      # moves.
      - name: Count breaking-change declarations across this PR's commits
        uses: 4cloudguru/shared-workflows/.github/actions/breaking-change-footers@9ed6d3c988fb075f1023680d92eb4cf5a8e55056 # v1.14.0
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
          repo: ${{ github.repository }}
  release-please-can-read-the-commit:
    name: release-please can read the merged commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      # hardening-exception: egress-audit — this job installs from the npm registry,
      #   calls the GitHub API, and clones this repository; harden-runner has never
      #   run in this repository, so no endpoint baseline exists and a block policy
      #   written without one fails closed on its first run; audit is what produces
      #   that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install the parser release-please uses
        working-directory: .github/commit-message-check
        # --ignore-scripts: npm runs dependency preinstall/install/postinstall
        # hooks by default, which is arbitrary code from the dependency tree.
        run: npm ci --ignore-scripts

      - name: Parse the commit this PR would squash into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits" \
            --jq '.[] | {sha: .sha, message: .commit.message, parents: (.parents | length)}' \
            > commits.ndjson

          node .github/commit-message-check/verify.mjs commits.ndjson
