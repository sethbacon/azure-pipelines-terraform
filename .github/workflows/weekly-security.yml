---
name: Weekly Security Scan

on:
  schedule:
    - cron: "0 8 * * 1" # Every Monday 08:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ci:
    # Raised for the workflow-security-record job inside unit-test.yml. A
    # called workflow's token is capped by its CALLER's, so a permission the
    # caller does not hold is a startup failure with zero jobs rather than a
    # red check (4cloudguru/shared-workflows#19).
    permissions:
      actions: read
      contents: read
      security-events: write
    name: CI
    uses: ./.github/workflows/unit-test.yml

  # ── OSV Vulnerability Scan ────────────────────────────
  osv-scan:
    name: OSV Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      # hardening-exception: egress-audit — this job queries the OSV vulnerability
      #   database, calls the GitHub API, and clones this repository; harden-runner
      #   has never run in this repository, so no endpoint baseline exists and a block
      #   policy written without one fails closed on its first run; audit is what
      #   produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run OSV-Scanner
        id: osv
        uses: google/osv-scanner-action/osv-scanner-action@c51854704019a247608d928f370c98740469d4b5 # v2.3.5
        continue-on-error: true
        with:
          scan-args: |-
            --recursive
            .
            --format=table
            --output=osv-results.txt

      # Surface the scan result in the run's Summary tab so a reviewer sees the
      # findings (or a clean result) without opening the step logs. Runs even
      # when the scan step reports vulnerabilities (continue-on-error above).
      - name: Publish OSV results to job summary
        if: always()
        run: |
          {
            echo '## OSV-Scanner Results'
            echo ''
            if [ -s osv-results.txt ]; then
              echo '```'
              cat osv-results.txt
              echo '```'
            else
              echo 'No known vulnerabilities found.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # DISTINGUISH A BROKEN SCANNER FROM A CLEAN ONE (#894).
      #
      # continue-on-error above collapses osv-scanner's exit 1 ("vulnerabilities
      # found") and its error exits -- 127 (general error) and 128 (no packages
      # found) -- into one `outcome == 'failure'`, and GitHub exposes the raw
      # exit code nowhere. So the step below used to file an issue TITLED
      # "vulnerabilities found" for a scanner that had simply stopped working.
      #
      # That is not hypothetical: terraform-state-manager-backend#334 filed
      # exactly that issue, asserting vulnerabilities that did not exist, while
      # seven genuinely reachable advisories stayed invisible. The scanner image
      # ships its own Go toolchain and runs it with GOTOOLCHAIN=local, so it
      # aborts on any module whose `go` directive is newer -- and a broken
      # scanner produced the same green as a clean one for weeks.
      #
      # CHECKED ON THE ARTIFACT, NOT THE EXIT CODE, because the exit code is
      # exactly what is unavailable. A findings table always names at least one
      # advisory; a scanner that aborted names none. That test is independent of
      # the output format and of however "no vulnerabilities found" is worded.
      #
      # This FAILS THE RUN rather than warning. A permanently-red Monday for a
      # broken scanner is the notification; a silently green one is the defect,
      # and the whole point of #894 is that the two were indistinguishable.
      - name: Distinguish a broken scanner from real findings
        id: osv_verdict
        if: steps.osv.outcome == 'failure'
        run: |
          set -euo pipefail
          if [ -s osv-results.txt ] && grep -qE '(GHSA|OSV|CVE|GO|PYSEC|RUSTSEC)-[0-9A-Za-z-]+' osv-results.txt; then
            echo "findings=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "findings=false" >> "$GITHUB_OUTPUT"
          echo "::error title=OSV-Scanner did not scan::osv-scanner exited non-zero but its output names no advisory. Exit 1 always carries at least one, so this was a scanner error (127 general error, or 128 no packages found), NOT a clean scan and NOT a finding. Do not file a vulnerabilities-found issue for it -- fix the scanner. See #894."
          {
            echo '## ⚠️ OSV-Scanner did not complete'
            echo ''
            echo 'The scan step exited non-zero but produced no advisory identifiers.'
            echo 'This run tells you **nothing** about whether this repository has'
            echo 'known vulnerabilities.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Create issue on new vulnerabilities
        if: steps.osv.outcome == 'failure' && steps.osv_verdict.outputs.findings == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // #724: search for an already-open issue for this same recurring
            // finding before filing a new one -- otherwise an unremediated
            // vulnerability gets a brand-new issue every Monday, burying any
            // genuinely new finding among duplicates. Matched on a stable
            // title PREFIX (the full title also embeds today's date) plus
            // both labels, so only a prior OSV-Scanner issue is ever matched.
            const titlePrefix = 'OSV-Scanner: vulnerabilities found';
            const title = `${titlePrefix} — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              '## OSV-Scanner Vulnerability Report',
              '',
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'OSV-Scanner found known vulnerabilities in npm dependencies. Please review the run summary (or the workflow logs) and update affected packages.',
            ].join('\n');

            const openIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,dependencies',
              per_page: 100,
            });
            const existing = openIssues.data.find((issue) => issue.title.startsWith(titlePrefix));

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing as of ${new Date().toISOString().slice(0,10)}:\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security', 'dependencies'],
              });
            }

  # ── Stale Dependabot PRs ──────────────────────────────
  stale-dependabot:
    name: Flag stale Dependabot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pull-requests: write
    steps:
      # hardening-exception: egress-audit — this job calls the GitHub API;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Label PRs open > 14 days
        id: label-stale
        # continue-on-error keeps a transient labeling hiccup from failing the
        # whole weekly run, but (unlike the old blanket `|| true`) the failure is
        # no longer swallowed: `set -o pipefail` propagates a `gh pr list` error
        # through the pipe, and the follow-up step surfaces any non-zero exit to
        # the run summary. Mirrors the osv-scan job's continue-on-error + explicit
        # outcome-check pattern above.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --author "app/dependabot" \
            --state open \
            --json number,createdAt,title \
            --jq '.[] | select((.createdAt | fromdateiso8601) < (now - 1209600)) | .number' \
          | xargs -r -I{} gh pr edit {} \
              --repo "$GITHUB_REPOSITORY" \
              --add-label "stale-security-patch"
      - name: Surface stale-PR labeling failures
        if: steps.label-stale.outcome == 'failure'
        run: |
          {
            echo '## Stale Dependabot PR labeling FAILED'
            echo ''
            echo 'The stale-Dependabot labeling step exited non-zero (a gh API/auth/rate-limit error, or a missing stale-security-patch label). Stale security PRs may not have been flagged this run; see the step logs.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Stale Dependabot PR labeling failed; see the run summary and step logs."

  # ── Marketplace environment protection verification ───
  # Verifies the `marketplace` GitHub Environment (which gates publish-marketplace
  # in release.yml) has at least one required reviewer configured. This closes the
  # verifiability gap from audit finding #19/#396: the "must have at least one
  # required reviewer" policy (CLAUDE.md) was previously asserted only in prose,
  # with no repository-visible or CI-checked source of truth, so silent removal
  # or misconfiguration of the rule would go undetected.
  verify-marketplace-environment-protection:
    name: Verify marketplace environment protection
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # hardening-exception: egress-audit — this job calls the GitHub API;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check required reviewers on the marketplace environment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const ENVIRONMENT = 'marketplace';
            let env;
            try {
              const response = await github.request('GET /repos/{owner}/{repo}/environments/{environment_name}', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment_name: ENVIRONMENT,
              });
              env = response.data;
            } catch (err) {
              if (err.status === 404) {
                core.setFailed(`The '${ENVIRONMENT}' GitHub Environment does not exist — publish-marketplace in release.yml references an environment with no protection rules at all.`);
                return;
              }
              // Confirmed against GitHub's REST API docs: reading environment
              // protection rules only requires ordinary repo read access (unlike
              // branch-protection/admin-settings endpoints, which need the
              // `administration` permission -- a scope GITHUB_TOKEN cannot grant
              // at all). A failure here is therefore unexpected; surface it
              // distinctly from a real policy gap so the two aren't confused.
              core.warning(`Could not verify the '${ENVIRONMENT}' environment's protection rules (HTTP ${err.status ?? 'unknown'}): ${err.message}. Verify manually via Settings -> Environments.`);
              return;
            }

            const rules = env.protection_rules ?? [];
            const requiredReviewersRule = rules.find((rule) => rule.type === 'required_reviewers');
            const hasRequiredReviewers = Boolean(requiredReviewersRule && Array.isArray(requiredReviewersRule.reviewers) && requiredReviewersRule.reviewers.length > 0);

            if (!hasRequiredReviewers) {
              core.setFailed(
                `The '${ENVIRONMENT}' GitHub Environment has no required-reviewer protection rule configured. ` +
                `CLAUDE.md documents this as mandatory ("must have at least one required reviewer") for every VS Marketplace publish. ` +
                `Configure it under Settings -> Environments -> ${ENVIRONMENT} -> Required reviewers.`
              );
              return;
            }

            // #780: a required-reviewers rule alone still lets the publish deploy
            // from ANY ref -- an unreviewed feature branch or a fork branch -- once
            // a reviewer approves that one run. Also require a deployment branch/ref
            // policy so only an approved branch/tag (e.g. main / v*) can ever reach
            // the marketplace publish. The environments API returns
            // deployment_branch_policy as null when unrestricted, or
            // { protected_branches, custom_branch_policies } booleans when a policy
            // is set (one of the two is true).
            const branchPolicy = env.deployment_branch_policy;
            const hasDeploymentBranchPolicy = Boolean(
              branchPolicy && (branchPolicy.protected_branches === true || branchPolicy.custom_branch_policies === true)
            );

            if (!hasDeploymentBranchPolicy) {
              core.setFailed(
                `The '${ENVIRONMENT}' GitHub Environment has no deployment branch/ref policy configured, ` +
                `so a marketplace publish could run from an unapproved ref even with reviewer approval. ` +
                `Configure it under Settings -> Environments -> ${ENVIRONMENT} -> Deployment branches and tags.`
              );
              return;
            }

            core.info(`OK: '${ENVIRONMENT}' environment has ${requiredReviewersRule.reviewers.length} required reviewer(s) and a deployment branch/ref policy configured.`);

  # ── Branch protection verification ─────────────────────
  # Verifies main's live branch protection still matches CLAUDE.md's "Branch
  # Protection" section (#1032 finding 1): unlike the marketplace environment
  # above, nothing previously confirmed the documented required-status-checks/
  # review/linear-history/conversation-resolution rules still match the live
  # repository, so a manual or accidental change to Settings -> Branches would
  # go undetected indefinitely.
  #
  # Reading branch protection needs the `administration:read` permission,
  # which GITHUB_TOKEN can never be granted (it is not one of the workflow
  # `permissions:` keys at all) -- so this mints a scoped token from the same
  # App already installed on this repo for release mechanics (RELEASE_DISPATCH_APP)
  # instead of adding a new App. If that App's installation has not been
  # extended with administration:read yet, the token-mint step below fails
  # closed with GitHub's own 422 rather than this job silently passing or
  # reading stale/wrong data -- extending the installation (Settings -> GitHub
  # Apps, on whichever account manages it) is an out-of-band, human step this
  # workflow cannot perform or verify for itself.
  verify-branch-protection:
    name: Verify main branch protection
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # hardening-exception: egress-audit — this job calls the GitHub API;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Verify the release App credentials are configured
        env:
          APP_ID: ${{ vars.RELEASE_DISPATCH_APP_ID }}
          APP_KEY: ${{ secrets.RELEASE_DISPATCH_APP_KEY }}
        run: |
          if [ -z "${APP_ID}" ] || [ -z "${APP_KEY}" ]; then
            echo "::error::Missing release App credentials. Set the repository variable RELEASE_DISPATCH_APP_ID and the repository secret RELEASE_DISPATCH_APP_KEY."
            exit 1
          fi
      - name: Get GitHub App token (needs administration:read on the RELEASE_DISPATCH_APP installation)
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_DISPATCH_APP_ID }}
          private-key: ${{ secrets.RELEASE_DISPATCH_APP_KEY }}
          # Requesting a permission the App's installation does not have fails
          # this step with a 422 rather than minting a token that then 403s on
          # the actual API call -- see #1032: this permission may not be
          # granted yet, and that failure mode is the expected first signal.
          permission-administration: read
      - name: Check main branch protection against CLAUDE.md
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const BRANCH = 'main';
            let protection;
            try {
              const response = await github.request('GET /repos/{owner}/{repo}/branches/{branch}/protection', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: BRANCH,
              });
              protection = response.data;
            } catch (err) {
              if (err.status === 404) {
                core.setFailed(`The '${BRANCH}' branch has no protection configured at all -- CLAUDE.md documents required status checks, required reviews, linear history, and more.`);
                return;
              }
              core.setFailed(`Could not read '${BRANCH}' branch protection (HTTP ${err.status ?? 'unknown'}): ${err.message}. This most likely means the RELEASE_DISPATCH_APP installation does not yet have administration:read -- see #1032.`);
              return;
            }

            const problems = [];

            // The exact ~29-context required-status-checks list (CLAUDE.md) is
            // deliberately NOT diffed context-by-context here -- it changes every
            // time a task's job matrix changes, which is ordinary maintenance, not
            // protection drift. Structural settings (strict mode, at least one
            // configured check) are what silently regresses unnoticed; an
            // individual context name is not.
            const statusChecks = protection.required_status_checks;
            if (!statusChecks || statusChecks.strict !== true) {
              problems.push('required_status_checks.strict is not true (CLAUDE.md: "strict — branch must be up-to-date")');
            }
            if (!statusChecks || !Array.isArray(statusChecks.checks) || statusChecks.checks.length === 0) {
              problems.push('required_status_checks has no configured contexts');
            }

            const reviews = protection.required_pull_request_reviews;
            if (!reviews || reviews.required_approving_review_count !== 1) {
              problems.push('required_pull_request_reviews.required_approving_review_count is not 1');
            }
            if (!reviews || reviews.dismiss_stale_reviews !== true) {
              problems.push('required_pull_request_reviews.dismiss_stale_reviews is not true');
            }
            if (!reviews || reviews.require_code_owner_reviews !== true) {
              problems.push('required_pull_request_reviews.require_code_owner_reviews is not true');
            }

            // enforce_admins is documented as intentionally false (accepted risk,
            // audit #499, solo maintainer) -- this checks it still matches that
            // documented choice, not that it is enabled. If it now reads true,
            // CLAUDE.md is stale, not the other way around.
            if (protection.enforce_admins?.enabled !== false) {
              problems.push('enforce_admins.enabled is not false (CLAUDE.md documents this as an accepted risk for a solo maintainer -- audit #499; if this changed deliberately, update CLAUDE.md rather than this check)');
            }
            if (protection.required_linear_history?.enabled !== true) {
              problems.push('required_linear_history.enabled is not true');
            }
            if (protection.required_conversation_resolution?.enabled !== true) {
              problems.push('required_conversation_resolution.enabled is not true');
            }
            if (protection.allow_force_pushes?.enabled !== false) {
              problems.push('allow_force_pushes.enabled is not false');
            }
            if (protection.allow_deletions?.enabled !== false) {
              problems.push('allow_deletions.enabled is not false');
            }

            if (problems.length > 0) {
              core.setFailed(
                `The '${BRANCH}' branch protection no longer matches CLAUDE.md's "Branch Protection" section (#1032):\n- ${problems.join('\n- ')}\n\nUpdate either the live branch protection settings or CLAUDE.md, whichever is now the intended source of truth.`
              );
              return;
            }

            core.info(`OK: '${BRANCH}' branch protection matches CLAUDE.md's documented settings (${statusChecks.checks.length} required status checks, ${reviews.required_approving_review_count} required review(s), code-owner review required, linear history required, conversation resolution required, force-pushes and deletions blocked).`);

  # ── OpenTofu cosign trust-root canary ──────────────────
  # Exercises the installer's REAL verifyCosignSignature() (cosign-verifier.ts) --
  # the exact argv it builds, including the version-bound certificate-identity regexp
  # (buildOpenTofuCertIdentityRegexp, #611) and pinned OIDC issuer -- against a real
  # cosign binary and a current OpenTofu release's SHA256SUMS/.sig/.pem. This is the
  # cosign equivalent of the hashicorp-gpg-canary below: it drives THIS codebase's
  # own invocation end-to-end rather than a hand-typed `cosign verify-blob`, so a bug
  # that only manifests against the real binary (a flag cosign silently ignores, a
  # ToolRunner wiring regression, drift between the pinned identity and OpenTofu's
  # actual release-signing identity, or a cosign CLI/flag change) is caught before it
  # breaks every default OpenTofu install in a customer pipeline (#497b, #656). The
  # per-PR unit-test job installs no cosign (and keyless verify-blob additionally
  # needs Sigstore-network access), so this real end-to-end invocation lives here,
  # where cosign is installed and network is available. Non-required: a failure here
  # only opens an issue via notify-on-failure below, it never blocks a PR.
  opentofu-cosign-canary:
    name: OpenTofu cosign trust-root canary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Tasks/TerraformInstaller/TerraformInstallerV1
    steps:
      # hardening-exception: egress-audit — this job installs from the npm registry
      #   and clones this repository; harden-runner has never run in this repository,
      #   so no endpoint baseline exists and a block policy written without one fails
      #   closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Install installer-task dependencies
        run: npm ci --ignore-scripts
      - name: Compile installer task (emits the JS the canary requires)
        run: npm run compile
      - name: Resolve latest OpenTofu release version
        id: version
        run: |
          version=$(curl -fsSL https://api.github.com/repos/opentofu/opentofu/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "Could not resolve the latest OpenTofu release version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Download SHA256SUMS
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: curl -fsSL -o SHA256SUMS "https://github.com/opentofu/opentofu/releases/download/v${VERSION}/tofu_${VERSION}_SHA256SUMS"
      - name: Verify SHA256SUMS with the installer's own cosign verifier (real argv, end-to-end)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # Reuses cosign-verifier.ts's verifyCosignSignature (required=true, so a
        # missing/bad signature or a wrong-identity certificate hard-fails) rather than
        # reimplementing the cosign invocation: it fetches the .sig/.pem from the same
        # GitHub release via the task's own http-client, builds the version-bound
        # identity regexp, and shells out to the real cosign binary with the exact argv
        # a production OpenTofu install uses.
        run: |
          node -e '
            const fs = require("fs");
            const { verifyCosignSignature } = require("./src/cosign-verifier");
            const version = process.env.VERSION;
            const content = fs.readFileSync("SHA256SUMS", "utf8");
            const base = "https://github.com/opentofu/opentofu/releases/download/v" + version + "/tofu_" + version + "_SHA256SUMS";
            verifyCosignSignature(content, base + ".sig", base + ".pem", version, true)
              .then(function () { console.log("OK: OpenTofu cosign signature verified via the task-owned verifier for tofu " + version); })
              .catch(function (err) { console.error("OpenTofu cosign canary FAILED: " + (err && err.message ? err.message : err)); process.exit(1); });
          '

  # ── HashiCorp GPG trust-root canary ────────────────────
  # Exercises the installer's REAL verifyGpgSignature() (gpg-verifier.ts) against
  # the embedded HashiCorp public key (hashicorp-gpg-key.ts) using a current
  # Terraform release's real SHA256SUMS/.sig from releases.hashicorp.com -- the
  # GPG equivalent of the cosign canary above. Catches a HashiCorp key rotation,
  # an openpgp behavior change, or drift in the embedded key before it breaks
  # every default Terraform/Sentinel install in a customer pipeline (#574). It
  # also fails EARLY (60-day lead) if the embedded key is nearing its own expiry,
  # so rotation is proactive rather than a fail-closed outage (#551; cf.
  # HCSEC-2026-03, where the prior key's self-signature lapsing hard-failed
  # ecosystem tooling in April 2026). Non-required: a failure here only opens an
  # issue via notify-on-failure below, it never blocks a PR.
  hashicorp-gpg-canary:
    name: HashiCorp GPG trust-root canary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Tasks/TerraformInstaller/TerraformInstallerV1
    steps:
      # hardening-exception: egress-audit — this job installs from the npm registry
      #   and clones this repository; harden-runner has never run in this repository,
      #   so no endpoint baseline exists and a block policy written without one fails
      #   closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Install installer-task dependencies
        run: npm ci --ignore-scripts
      - name: Compile installer task (emits the JS the canary requires)
        run: npm run compile
      - name: Resolve latest Terraform release version
        id: version
        run: |
          version=$(curl -fsSL https://checkpoint-api.hashicorp.com/v1/check/terraform | jq -r '.current_version')
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "Could not resolve the latest Terraform release version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Download SHA256SUMS
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: curl -fsSL -o SHA256SUMS "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_SHA256SUMS"
      - name: Verify SHA256SUMS with the installer's own GPG verifier + embedded key
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # Reuses gpg-verifier.ts's verifyGpgSignature (required=true, so a missing
        # or bad signature hard-fails) rather than reimplementing any crypto; it
        # fetches the .sig from releases.hashicorp.com via the task's own
        # http-client and verifies it against the embedded HASHICORP_GPG_PUBLIC_KEY.
        run: |
          node -e '
            const fs = require("fs");
            const { verifyGpgSignature } = require("./src/gpg-verifier");
            const version = process.env.VERSION;
            const content = fs.readFileSync("SHA256SUMS", "utf8");
            const sigUrl = "https://releases.hashicorp.com/terraform/" + version + "/terraform_" + version + "_SHA256SUMS.sig";
            verifyGpgSignature(content, sigUrl, true)
              .then(function () { console.log("OK: HashiCorp GPG signature verified against the embedded key for terraform " + version); })
              .catch(function (err) { console.error("HashiCorp GPG canary FAILED: " + (err && err.message ? err.message : err)); process.exit(1); });
          '
      - name: Fail if the embedded HashiCorp key or its signing subkey is within 60 days of expiry
        # Loads the embedded key with the task's own openpgp dependency and fails
        # early so the rotation (which must land in BOTH installer copies, gated by
        # check-shared-modules.js) is proactive, never a reactive outage.
        #
        # HashiCorp signs release SHA256SUMS with a signing SUBKEY that can expire
        # before the primary key, so checking only the primary would miss a signing
        # subkey lapse -- the HCSEC-2026-03 class event. We warn on the EARLIEST
        # expiry across the primary key AND every subkey that is CURRENTLY usable for
        # signing (openpgp's getSigningKey view of the active trust path). Rotated-out
        # signing subkeys and encryption-only subkeys are deliberately excluded: the
        # embedded key today carries a long-expired 2022 signing subkey and a 2030
        # encryption subkey, neither of which affects whether signature verification
        # keeps working, and including them would fail this job permanently/spuriously.
        run: |
          node -e '
            const openpgp = require("openpgp");
            const { HASHICORP_GPG_PUBLIC_KEY } = require("./src/hashicorp-gpg-key");
            (async function () {
              const now = new Date();
              const key = await openpgp.readKey({ armoredKey: HASHICORP_GPG_PUBLIC_KEY });
              const components = [{ label: "primary key " + key.getKeyID().toHex(), exp: await key.getExpirationTime() }];
              for (const sub of key.subkeys) {
                let usable = false;
                try { await key.getSigningKey(sub.getKeyID(), now); usable = true; } catch (e) { usable = false; }
                if (!usable) { console.log("Skipping subkey " + sub.getKeyID().toHex() + " (not a currently-usable signing subkey)."); continue; }
                components.push({ label: "signing subkey " + sub.getKeyID().toHex(), exp: await sub.getExpirationTime() });
              }
              let earliest = null;
              for (const c of components) {
                if (c.exp === Infinity) { console.log("OK: " + c.label + " has no expiration set."); continue; }
                if (!c.exp) { console.error("Embedded HashiCorp " + c.label + " expiry could not be determined (getExpirationTime returned " + String(c.exp) + ")."); process.exit(1); }
                console.log("Embedded HashiCorp " + c.label + " expires " + c.exp.toISOString() + ".");
                if (!earliest || c.exp.getTime() < earliest.exp.getTime()) { earliest = c; }
              }
              if (!earliest) { console.log("OK: no embedded HashiCorp key component has an expiration set."); return; }
              const days = Math.floor((earliest.exp.getTime() - Date.now()) / 86400000);
              console.log("Earliest-expiring component: " + earliest.label + " on " + earliest.exp.toISOString() + " (" + days + " days from now).");
              if (days < 60) { console.error("Embedded HashiCorp GPG " + earliest.label + " expires in " + days + " days (< 60). Rotate hashicorp-gpg-key.ts in BOTH installer copies ahead of expiry -- see HCSEC-2026-03."); process.exit(1); }
            })().catch(function (err) { console.error("Key-expiry check FAILED: " + (err && err.message ? err.message : err)); process.exit(1); });
          '

  # ── sha256-only installer drift canary ─────────────────
  # OPA and terraform-docs are the two installer paths with NO upstream signature
  # to verify -- a published sha256 is the entire trust anchor, so a silent change
  # to the release-asset naming or the checksum-file format would not break a
  # signature check, it would break checksum verification itself. The two canaries
  # above cover the SIGNED paths (OpenTofu/cosign, Terraform/GPG); this covers the
  # unsigned ones (#892). It reuses each installer's own exported asset-name builder
  # and checksum parser rather than reimplementing them, so the canary cannot drift
  # from what the shipped task actually enforces.
  sha256-only-installer-drift-canary:
    name: sha256-only installer drift canary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # hardening-exception: egress-audit — this job installs from the npm registry
      #   and clones this repository; harden-runner has never run in this repository,
      #   so no endpoint baseline exists and a block policy written without one fails
      #   closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Install + compile PolicyAgentInstaller (emits the JS the canary requires)
        working-directory: Tasks/PolicyAgentInstaller/PolicyAgentInstallerV1
        run: npm ci --ignore-scripts && npm run compile
      - name: Install + compile TerraformDocsInstaller (emits the JS the canary requires)
        working-directory: Tasks/TerraformDocsInstaller/TerraformDocsInstallerV1
        run: npm ci --ignore-scripts && npm run compile
      - name: Resolve latest OPA release version
        id: opa-version
        run: |
          version=$(curl -fsSL https://api.github.com/repos/open-policy-agent/opa/releases/latest | jq -r '.tag_name')
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "Could not resolve the latest OPA release version" >&2
            exit 1
          fi
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"
      - name: Resolve latest terraform-docs release version
        id: tfdocs-version
        run: |
          version=$(curl -fsSL https://api.github.com/repos/terraform-docs/terraform-docs/releases/latest | jq -r '.tag_name')
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "Could not resolve the latest terraform-docs release version" >&2
            exit 1
          fi
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"
      - name: OPA — asset and checksum sidecar still match what the installer expects
        working-directory: Tasks/PolicyAgentInstaller/PolicyAgentInstallerV1
        env:
          VERSION: ${{ steps.opa-version.outputs.version }}
        # A rename or checksum-format change upstream is reported as DRIFT, distinct
        # from a curl network failure, so a transient blip is never mistaken for one.
        run: |
          node -e '
            const { getOpaAssetName, parseFirstSha256 } = require("./src/policy-agent-installer");
            const version = process.env.VERSION;
            const asset = getOpaAssetName();
            const base = "https://github.com/open-policy-agent/opa/releases/download/v" + version + "/" + asset;
            (async function () {
              const head = await fetch(base, { method: "HEAD", redirect: "follow" });
              if (!head.ok) { throw new Error("DRIFT: expected OPA asset " + asset + " not published for v" + version + " (HTTP " + head.status + ") at " + base); }
              const res = await fetch(base + ".sha256", { redirect: "follow" });
              if (!res.ok) { throw new Error("DRIFT: OPA checksum sidecar missing for " + asset + " (HTTP " + res.status + ")"); }
              const body = await res.text();
              const digest = parseFirstSha256(body, asset);
              if (!/^[0-9a-f]{64}$/.test(digest)) { throw new Error("DRIFT: OPA checksum sidecar no longer parses to a bare sha256 -- got " + JSON.stringify(digest)); }
              console.log("OK: OPA v" + version + " asset " + asset + " present with a parseable sha256 (" + digest.slice(0, 12) + "...).");
            })().catch(function (err) { console.error("OPA sha256-only canary FAILED: " + (err && err.message ? err.message : err)); process.exit(1); });
          '
      - name: terraform-docs — asset and checksum file still match what the installer expects
        working-directory: Tasks/TerraformDocsInstaller/TerraformDocsInstallerV1
        env:
          VERSION: ${{ steps.tfdocs-version.outputs.version }}
        run: |
          node -e '
            const { getAssetName, parseSha256 } = require("./src/terraform-docs-installer");
            const version = process.env.VERSION;
            const asset = getAssetName(version);
            const base = "https://github.com/terraform-docs/terraform-docs/releases/download/v" + version + "/";
            (async function () {
              const head = await fetch(base + asset, { method: "HEAD", redirect: "follow" });
              if (!head.ok) { throw new Error("DRIFT: expected terraform-docs asset " + asset + " not published for v" + version + " (HTTP " + head.status + ")"); }
              const sumsName = "terraform-docs-v" + version + ".sha256sum";
              const res = await fetch(base + sumsName, { redirect: "follow" });
              if (!res.ok) { throw new Error("DRIFT: terraform-docs checksum file " + sumsName + " missing (HTTP " + res.status + ")"); }
              const digest = parseSha256(await res.text(), asset);
              if (!/^[0-9a-f]{64}$/.test(digest)) { throw new Error("DRIFT: terraform-docs checksum file no longer lists " + asset + " in the expected format"); }
              console.log("OK: terraform-docs v" + version + " asset " + asset + " listed in " + sumsName + " (" + digest.slice(0, 12) + "...).");
            })().catch(function (err) { console.error("terraform-docs sha256-only canary FAILED: " + (err && err.message ? err.message : err)); process.exit(1); });
          '

  # ── Notify on failure ─────────────────────────────────
  notify-on-failure:
    name: Create issue on failure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      [
        ci,
        osv-scan,
        stale-dependabot,
        verify-marketplace-environment-protection,
        verify-branch-protection,
        opentofu-cosign-canary,
        hashicorp-gpg-canary,
        sha256-only-installer-drift-canary,
      ]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      # hardening-exception: egress-audit — this job calls the GitHub API;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Create failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // #724: same dedup-before-create as the OSV-scan step above -- a
            // persistent scheduled-build failure would otherwise get a new
            // issue every Monday instead of one issue tracking the ongoing
            // failure.
            const titlePrefix = 'Scheduled build failed';
            const title = `${titlePrefix} — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              '## Scheduled Build Failure',
              '',
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'The weekly security scan failed. Please investigate and fix before the next release.',
            ].join('\n');

            const openIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bug,ci',
              per_page: 100,
            });
            const existing = openIssues.data.find((issue) => issue.title.startsWith(titlePrefix));

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing as of ${new Date().toISOString().slice(0,10)}:\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['bug', 'ci'],
              });
            }
