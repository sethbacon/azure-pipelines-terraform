---
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3)"
        required: true

permissions:
  contents: read

# Serialize overlapping release runs for the same tag (issue #762): a tag push
# and a workflow_dispatch for that same tag firing close together — or two
# workflow_dispatch runs for the same tag — would otherwise race through
# guard/build/publish concurrently. Non-cancelling: this pipeline publishes
# external, hard-to-undo artifacts (a GitHub Release, a VS Marketplace
# listing), so an in-flight run must be allowed to finish rather than being
# killed mid-publish; a second run for the same tag simply queues behind it.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  guard:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.resolve-sha.outputs.sha }}
    steps:
      # #1028: this job's `git fetch origin main` and marketplace-environment
      # github-script call are the FIRST network activity in the release chain,
      # ahead of every downstream job that needs its resolved SHA. Baseline
      # captured from 4 real release runs (v1.14.6-v1.14.10) via harden-runner's
      # own audit-mode connection log:
      #   github.com    — actions/checkout, git fetch origin main
      #   api.github.com — the marketplace-environment-protection github-script call
      #   *.actions.githubusercontent.com — Actions-internal results reporting,
      #     wildcarded because it is one of several per-run control-plane hosts
      #     observed varying by shard/region in the sibling jobs below, not
      #     something this job or repo controls.
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.actions.githubusercontent.com:443
      # The push trigger's own `tags:` filter (above) already constrains a tag
      # push to the vX.Y.Z shape, but workflow_dispatch's `tag` input is free
      # text -- the "Check tag reachable from main" and "Verify extension
      # version matches tag" steps below both assume that shape (the latter
      # strips a leading 'v' and compares against a semver string) without
      # ever confirming it. A malformed value isn't a security bypass on its
      # own -- TAG is only ever used as an env var, quoted, never interpolated
      # into a shell/API call -- but it can make those later steps misbehave
      # in confusing ways (e.g. "v" with no digits silently no-ops the strip
      # and just compares the literal string). Fail fast, before any network
      # calls, on the one input source (workflow_dispatch) that isn't already
      # shape-constrained by the trigger itself.
      - name: Validate workflow_dispatch tag shape
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::workflow_dispatch tag '${TAG}' does not match the required vX.Y.Z shape (the same shape the push trigger's own tags: filter enforces)." >&2
            exit 1
          fi
      # Preventive, release-time mirror of weekly-security.yml's
      # verify-marketplace-environment-protection job (which is only a weekly
      # DETECTIVE canary): assert the 'marketplace' environment that gates
      # publish-marketplace still has a required-reviewer rule, as an early
      # BLOCKING step so a silently removed/misconfigured reviewer rule fails
      # THIS release instead of going unnoticed until the next Monday scan.
      # Same GET /repos/.../environments/{name} call and same contents:read
      # token (inherited from the workflow-level permissions) as the weekly job;
      # the only deliberate divergence is fail-closed error handling (setFailed,
      # not the weekly canary's soft warning) — a release must not publish past
      # a gate it could not verify.
      - name: Verify marketplace environment protection
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const ENVIRONMENT = 'marketplace';
            let env;
            try {
              const response = await github.request('GET /repos/{owner}/{repo}/environments/{environment_name}', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment_name: ENVIRONMENT,
              });
              env = response.data;
            } catch (err) {
              if (err.status === 404) {
                core.setFailed(`The '${ENVIRONMENT}' GitHub Environment does not exist — publish-marketplace in release.yml references an environment with no protection rules at all.`);
                return;
              }
              core.setFailed(`Could not verify the '${ENVIRONMENT}' environment's protection rules (HTTP ${err.status ?? 'unknown'}): ${err.message}. Failing the release rather than publishing past an unverifiable gate.`);
              return;
            }

            const rules = env.protection_rules ?? [];
            const requiredReviewersRule = rules.find((rule) => rule.type === 'required_reviewers');
            const hasRequiredReviewers = Boolean(requiredReviewersRule && Array.isArray(requiredReviewersRule.reviewers) && requiredReviewersRule.reviewers.length > 0);

            if (!hasRequiredReviewers) {
              core.setFailed(
                `The '${ENVIRONMENT}' GitHub Environment has no required-reviewer protection rule configured. ` +
                `CLAUDE.md documents this as mandatory ("must have at least one required reviewer") for every VS Marketplace publish. ` +
                `Configure it under Settings -> Environments -> ${ENVIRONMENT} -> Required reviewers.`
              );
              return;
            }

            // #780: a required-reviewers rule alone still lets the publish deploy
            // from ANY ref -- an unreviewed feature branch or a fork branch -- once
            // a reviewer approves that one run. Also require a deployment branch/ref
            // policy so only an approved branch/tag (e.g. main / v*) can ever reach
            // the marketplace publish. The environments API returns
            // deployment_branch_policy as null when unrestricted, or
            // { protected_branches, custom_branch_policies } booleans when a policy
            // is set (one of the two is true).
            const branchPolicy = env.deployment_branch_policy;
            const hasDeploymentBranchPolicy = Boolean(
              branchPolicy && (branchPolicy.protected_branches === true || branchPolicy.custom_branch_policies === true)
            );

            if (!hasDeploymentBranchPolicy) {
              core.setFailed(
                `The '${ENVIRONMENT}' GitHub Environment has no deployment branch/ref policy configured, ` +
                `so a marketplace publish could run from an unapproved ref even with reviewer approval. ` +
                `Configure it under Settings -> Environments -> ${ENVIRONMENT} -> Deployment branches and tags.`
              );
              return;
            }

            core.info(`OK: '${ENVIRONMENT}' environment has ${requiredReviewersRule.reviewers.length} required reviewer(s) and a deployment branch/ref policy configured.`);
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check tag reachable from main
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "refs/tags/${TAG}" origin/main 2>/dev/null; then
            echo "Tag ${TAG} is not reachable from origin/main. Releases must be tagged on main." >&2
            exit 1
          fi
      - name: Verify extension version matches tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          TAG_VERSION="${TAG#v}"
          EXT_VERSION=$(node -p "require('./azure-devops-extension.json').version")
          if [ "$TAG_VERSION" != "$EXT_VERSION" ]; then
            echo "::error::Tag version (${TAG_VERSION}) does not match azure-devops-extension.json version (${EXT_VERSION}). Merge the release-please PR before tagging."
            exit 1
          fi
      - name: Verify per-task Minor bumps
        run: |
          # Fail the release if any task's src/ changed since the previous release tag
          # without its task.json Minor being bumped: ADO agents cache tasks by
          # Major.Minor, so an un-bumped fix would ship to the Marketplace but never
          # reach running agents.
          node scripts/check-minor-bumps.js
      - name: Resolve validated commit SHA
        id: resolve-sha
        # Every downstream job checks out this exact commit instead of
        # re-resolving the tag name, so nothing published later in the
        # pipeline can be swapped out by a tag move after this point.
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  ci:
    # Raised for the workflow-security-record job inside unit-test.yml. A
    # called workflow's token is capped by its CALLER's, so a permission the
    # caller does not hold is a startup failure with zero jobs rather than a
    # red check (4cloudguru/shared-workflows#19).
    permissions:
      actions: read
      contents: read
      security-events: write
    name: CI (build + test)
    needs: guard
    uses: ./.github/workflows/unit-test.yml
    with:
      ref: ${{ needs.guard.outputs.sha }}

  build:
    name: Build release bundle
    needs: [guard, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # hardening-exception: egress-audit — this job installs from the npm registry,
      #   transfers artifacts through the Actions API, and clones this repository;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.guard.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Install root dependencies
        run: npm ci --ignore-scripts
      - name: Build release
        run: npm run build:release
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build
          path: build/
          retention-days: 1

  package:
    name: Package extension (.vsix)
    needs: [guard, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # hardening-exception: egress-audit — this job installs from the npm registry,
      #   transfers artifacts through the Actions API, and clones this repository;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.guard.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Install root dependencies
        run: npm ci --ignore-scripts
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build
          path: build/
      - name: Package extension
        run: npm run package:release
      - name: Upload vsix artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: "*.vsix"
          retention-days: 7

  sbom-and-sign:
    name: Generate SBOM and sign VSIX
    needs: [guard, package]
    permissions:
      contents: read
      id-token: write
      attestations: write # required by attest-build-provenance / attest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # #1028: this job holds id-token:write + attestations:write, so a
      # compromised transitive dependency here (--ignore-scripts stops install-time
      # hooks, not a package's own invoked logic) could try to exfiltrate either
      # token over the network. Baseline captured from 4 real release runs
      # (v1.14.6-v1.14.10) via harden-runner's own audit-mode connection log:
      #   github.com            — actions/checkout
      #   registry.npmjs.org    — npm ci (root + 11 per-task installs)
      #   release-assets.githubusercontent.com — cosign-installer downloading the cosign binary
      #   fulcio.sigstore.dev / rekor.sigstore.dev / timestamp.sigstore.dev /
      #     tuf-repo-cdn.sigstore.dev — cosign keyless sign-blob (Fulcio CA, Rekor log, TSA, TUF root)
      #   api.github.com        — attest-build-provenance / attest uploading attestations
      #   *.actions.githubusercontent.com — Actions-internal (results reporting, OIDC token
      #     endpoint, and a per-run "run-actions-N-azure-<region>" control-plane host that
      #     changes every run); *.blob.core.windows.net — artifact upload/download's storage
      #     backend, observed as 4 different "productionresultssaNN" shards across 4 runs.
      #     Both are wildcarded because the exact subdomain is assigned per-run/per-shard by
      #     GitHub/Azure, not something this job or repo controls (confirmed varying across
      #     the sampled runs) — a fixed list of past shard names would fail closed on the very
      #     next release that lands on an unseen one.
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            registry.npmjs.org:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.guard.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      # --ignore-scripts: this job holds id-token/attestations:write. tfx-cli and
      # @cyclonedx/cyclonedx-npm are pure-JS and need no lifecycle scripts to run
      # (verified against azure-pipelines-packer's identical fix, #102); skipping
      # scripts denies a compromised transitive dependency (e.g. a routine
      # lockfile bump) code execution in this privileged context.
      - name: Install root dependencies
        run: npm ci --ignore-scripts
      - name: Generate SBOM for TerraformTaskV5
        run: |
          cd Tasks/TerraformTask/TerraformTaskV5
          npm ci --omit=dev --ignore-scripts
          npx --no-install cyclonedx-npm --output-file ../../../sbom-terraform-task-v5.cdx.json --omit dev
      - name: Generate SBOM for TerraformInstallerV1
        run: |
          cd Tasks/TerraformInstaller/TerraformInstallerV1
          npm ci --omit=dev --ignore-scripts
          npx --no-install cyclonedx-npm --output-file ../../../sbom-terraform-installer-v1.cdx.json --omit dev
      - name: Generate SBOM for TerraformProviderMirrorV1
        run: |
          cd Tasks/TerraformProviderMirror/TerraformProviderMirrorV1
          npm ci --omit=dev --ignore-scripts
          npx --no-install cyclonedx-npm --output-file ../../../sbom-terraform-provider-mirror-v1.cdx.json --omit dev
      - name: Generate SBOM for PolicyAgentInstallerV1
        run: |
          cd Tasks/PolicyAgentInstaller/PolicyAgentInstallerV1
          npm ci --omit=dev --ignore-scripts
          npx --no-install cyclonedx-npm --output-file ../../../sbom-policy-agent-installer-v1.cdx.json --omit dev
      - name: Generate SBOM for TerraformPolicyCheckV1
        run: |
          cd Tasks/TerraformPolicyCheck/TerraformPolicyCheckV1
          npm ci --omit=dev --ignore-scripts
          npx --no-install cyclonedx-npm --output-file ../../../sbom-terraform-policy-check-v1.cdx.json --omit dev
      - name: Generate SBOM for TerraformDriftReportV1
        run: |
          cd Tasks/TerraformDriftReport/TerraformDriftReportV1
          npm ci --omit=dev --ignore-scripts
          npx --no-install cyclonedx-npm --output-file ../../../sbom-terraform-drift-report-v1.cdx.json --omit dev
      - name: Generate SBOM for TerraformModulePublishV1
        run: |
          cd Tasks/TerraformModulePublish/TerraformModulePublishV1
          npm ci --omit=dev --ignore-scripts
          npx --no-install cyclonedx-npm --output-file ../../../sbom-terraform-module-publish-v1.cdx.json --omit dev
      - name: Generate SBOM for TerraformDocsInstallerV1
        run: |
          cd Tasks/TerraformDocsInstaller/TerraformDocsInstallerV1
          npm ci --omit=dev --ignore-scripts
          npx --no-install cyclonedx-npm --output-file ../../../sbom-terraform-docs-installer-v1.cdx.json --omit dev
      - name: Generate SBOM for TerraformDocsV1
        run: |
          cd Tasks/TerraformDocs/TerraformDocsV1
          npm ci --omit=dev --ignore-scripts
          npx --no-install cyclonedx-npm --output-file ../../../sbom-terraform-docs-v1.cdx.json --omit dev
      - name: Generate SBOM for Markdown2HtmlV1
        run: |
          cd Tasks/Markdown2Html/Markdown2HtmlV1
          npm ci --omit=dev --ignore-scripts
          npx --no-install cyclonedx-npm --output-file ../../../sbom-markdown2html-v1.cdx.json --omit dev
      - name: Generate SBOM for PublishKbArticleV1
        run: |
          cd Tasks/PublishKbArticle/PublishKbArticleV1
          npm ci --omit=dev --ignore-scripts
          npx --no-install cyclonedx-npm --output-file ../../../sbom-publish-kb-article-v1.cdx.json --omit dev
      - name: Generate SBOM for tab
        # The Terraform results tab ships as build/tab/tabContent.js inside the
        # .vsix — webpack bundles react, react-dom, azure-devops-extension-sdk and
        # azure-devops-extension-api into it. Those four live in the ROOT
        # package.json's devDependencies (alongside pure build tooling like
        # webpack/tfx-cli/jest), because the root manifest has no runtime
        # "dependencies" of its own. A `--omit dev` scan here would therefore emit
        # an EMPTY SBOM, so — unlike the 11 per-task steps above — the tab SBOM is
        # generated over the full (dev-included) root install. This over-captures
        # the build tooling that never ships in the bundle, but it is the only way
        # to capture the tab's actual bundled runtime closure without a
        # hand-maintained allowlist. The root `npm ci --ignore-scripts` above
        # already installed the full dev tree, so no reinstall is needed here.
        run: npx --no-install cyclonedx-npm --output-file sbom-tab.cdx.json
      - name: Download vsix artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign VSIX with cosign keyless
        run: |
          VSIX_FILE=$(find . -maxdepth 1 -name "*.vsix" -print -quit)
          cosign sign-blob --yes "$VSIX_FILE" --bundle "${VSIX_FILE}.bundle"
      # GitHub-native build provenance + SBOM attestations for the published .vsix.
      # Verifiable with: gh attestation verify <file.vsix> --repo sethbacon/azure-pipelines-terraform
      - name: Attest build provenance for VSIX
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "*.vsix"
      - name: Attest SBOM (TerraformTaskV5) for VSIX
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: "*.vsix"
          sbom-path: "sbom-terraform-task-v5.cdx.json"
      - name: Attest SBOM (TerraformInstallerV1) for VSIX
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: "*.vsix"
          sbom-path: "sbom-terraform-installer-v1.cdx.json"
      - name: Attest SBOM (TerraformProviderMirrorV1) for VSIX
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: "*.vsix"
          sbom-path: "sbom-terraform-provider-mirror-v1.cdx.json"
      - name: Attest SBOM (PolicyAgentInstallerV1) for VSIX
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: "*.vsix"
          sbom-path: "sbom-policy-agent-installer-v1.cdx.json"
      - name: Attest SBOM (TerraformPolicyCheckV1) for VSIX
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: "*.vsix"
          sbom-path: "sbom-terraform-policy-check-v1.cdx.json"
      - name: Attest SBOM (TerraformDriftReportV1) for VSIX
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: "*.vsix"
          sbom-path: "sbom-terraform-drift-report-v1.cdx.json"
      - name: Attest SBOM (TerraformModulePublishV1) for VSIX
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: "*.vsix"
          sbom-path: "sbom-terraform-module-publish-v1.cdx.json"
      - name: Attest SBOM (TerraformDocsInstallerV1) for VSIX
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: "*.vsix"
          sbom-path: "sbom-terraform-docs-installer-v1.cdx.json"
      - name: Attest SBOM (TerraformDocsV1) for VSIX
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: "*.vsix"
          sbom-path: "sbom-terraform-docs-v1.cdx.json"
      - name: Attest SBOM (Markdown2HtmlV1) for VSIX
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: "*.vsix"
          sbom-path: "sbom-markdown2html-v1.cdx.json"
      - name: Attest SBOM (PublishKbArticleV1) for VSIX
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: "*.vsix"
          sbom-path: "sbom-publish-kb-article-v1.cdx.json"
      - name: Attest SBOM (tab) for VSIX
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: "*.vsix"
          sbom-path: "sbom-tab.cdx.json"
      - name: Upload SBOM and signature artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-and-signatures
          path: |
            sbom-*.cdx.json
            *.vsix.bundle
          retention-days: 7

  draft-release:
    name: Create Draft GitHub Release
    needs: [guard, package, sbom-and-sign]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      # hardening-exception: egress-audit — this job transfers artifacts through the
      #   Actions API and clones this repository; harden-runner has never run in this
      #   repository, so no endpoint baseline exists and a block policy written
      #   without one fails closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.guard.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download vsix artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
      - name: Download SBOM and signature artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-and-signatures
      # Same integrity gate as publish-marketplace: verify the VSIX against its
      # cosign bundle (identity/issuer pinned to this repo's release.yml) before
      # attaching it to the GitHub Release, so the release never distributes an
      # artifact that fails signature verification. This release stays a draft
      # until publish-marketplace succeeds (undraft-release), so a failure here
      # blocks publication too. Shared with azure-pipelines-packer and
      # azure-pipelines-release-docs.
      - name: Verify VSIX signature before release
        uses: 4cloudguru/shared-workflows/.github/actions/verify-vsix-signature@450841eb41e83ae6d0b0a3ee20d1217b2887391b # v1.20.0
        with:
          certificate-identity-regexp: '^https://github\.com/sethbacon/azure-pipelines-terraform/\.github/workflows/release\.yml@refs/(tags/v[0-9]+\.[0-9]+\.[0-9]+|heads/main)$'
      - name: Create draft GitHub Release
        id: create_release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            *.vsix
            sbom-*.cdx.json
            *.vsix.bundle
          generate_release_notes: true
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true

  publish-marketplace:
    name: Publish to VS Marketplace
    needs: [guard, draft-release]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: marketplace
    permissions:
      id-token: write # GitHub OIDC -> Microsoft Entra federated credential
      contents: read
    steps:
      # #1028: this job holds a live Entra-federated Marketplace-publish
      # credential, so a compromised transitive dependency here (--ignore-scripts
      # stops install-time hooks, not a package's own invoked logic) could try to
      # exfiltrate it over the network. Baseline captured from 4 real release runs
      # (v1.14.6-v1.14.10) via harden-runner's own audit-mode connection log:
      #   github.com            — actions/checkout
      #   registry.npmjs.org    — npm ci (root)
      #   release-assets.githubusercontent.com — cosign-installer downloading the cosign binary
      #   raw.githubusercontent.com — cosign-installer's own bootstrap-vs-requested-release
      #     SHA comparison; absent from this comment's original 4-run baseline but present
      #     on every one of 5 real runs sampled from azure-pipelines-release-docs at the
      #     same cosign-installer pin while centralizing this job (2026-09-04) -- the
      #     earlier baseline was incomplete, not this host being release-docs-specific.
      #   tuf-repo-cdn.sigstore.dev — cosign verify-blob's Sigstore TUF trust root fetch
      #     (verify-blob reads the cert+Rekor entry from the bundle itself, so unlike
      #     sbom-and-sign's sign-blob this needs no live Fulcio/Rekor/TSA call)
      #   login.microsoftonline.com — azure/login OIDC + az account get-access-token
      #   management.azure.com  — azure/login (subscription/tenant resolution)
      #   *.blob.core.windows.net — az CLI's own cache/telemetry (azcliprod...) plus
      #     the Actions artifact download's storage backend, observed as 4 different
      #     "productionresultssaNN" shards across 4 runs — wildcarded because the
      #     exact subdomain is assigned per-run/per-shard, not something this job or
      #     repo controls; a fixed list of past shard names would fail closed on the
      #     very next release that lands on an unseen one.
      #   dc.services.visualstudio.com — Application Insights telemetry (az CLI / tfx)
      #   app.vssps.visualstudio.com / marketplace.visualstudio.com — tfx publishing
      #     the .vsix to the VS Marketplace (the actual point of this job)
      #   *.actions.githubusercontent.com — Actions-internal (results reporting and a
      #     per-run "run-actions-N-azure-<region>" control-plane host that changes
      #     every run); *.githubapp.com — the hosted-runner orchestrator/watchdog's own
      #     periodic heartbeat, observed with different region+instance suffixes
      #     ("eus-02", "iad-02") across runs. Both wildcarded for the same per-run/
      #     per-shard reason as the blob-storage entry above.
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            login.microsoftonline.com:443
            management.azure.com:443
            dc.services.visualstudio.com:443
            app.vssps.visualstudio.com:443
            marketplace.visualstudio.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.guard.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      # --ignore-scripts: this job holds id-token:write for the Entra federated
      # credential. tfx-cli is pure-JS and needs no lifecycle scripts to run;
      # skipping scripts denies a compromised transitive dependency code
      # execution alongside the token-minting step below (see SECURITY.md).
      - name: Install root dependencies
        run: npm ci --ignore-scripts
      - name: Download vsix artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
      # The signing job (sbom-and-sign) produced a cosign keyless sign-blob
      # bundle over the exact VSIX bytes and uploaded it in sbom-and-signatures.
      # Re-download it here so the integrity gate below verifies the SAME bytes
      # that are about to be published, not merely that "some valid signature
      # exists" somewhere.
      - name: Download SBOM and signature artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-and-signatures
      # Integrity gate: re-verify the downloaded VSIX against the cosign bundle
      # from sbom-and-sign BEFORE the token-authenticated publish, pinning the
      # signer identity to THIS repo's release.yml workflow and the GitHub
      # Actions OIDC issuer (the same identity/issuer anchoring the OpenTofu
      # cosign canary in weekly-security.yml uses). An artifact substituted
      # between jobs — a compromised actions/download-artifact, or an
      # artifact-store isolation failure — fails the release here rather than
      # being published to the Marketplace. `--bundle` carries the cert +
      # Rekor entry, so no id-token is needed for verification. Shared with
      # azure-pipelines-packer (which had no equivalent gate at all before
      # this) and azure-pipelines-release-docs.
      - name: Verify VSIX signature before publish
        uses: 4cloudguru/shared-workflows/.github/actions/verify-vsix-signature@450841eb41e83ae6d0b0a3ee20d1217b2887391b # v1.20.0
        with:
          certificate-identity-regexp: '^https://github\.com/sethbacon/azure-pipelines-terraform/\.github/workflows/release\.yml@refs/(tags/v[0-9]+\.[0-9]+\.[0-9]+|heads/main)$'
      # Authenticate to Microsoft Entra via GitHub OIDC (federated credential) —
      # no stored secret. The service principal is a member of the 'sethbacon'
      # Marketplace publisher. Replaces the deprecated full-scoped TFX_PAT.
      - name: Azure login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZDO_PUBLISH_CLIENT_ID }}
          tenant-id: ${{ vars.AZDO_PUBLISH_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Mint a Microsoft Entra token for the Marketplace publish
        id: mint-token
        run: |
          VSIX_FILE=$(find . -maxdepth 1 -name "*.vsix" -print -quit)
          echo "vsix-file=$VSIX_FILE" >> "$GITHUB_OUTPUT"
          # 499b84ac-1321-427f-aa17-267ca6975798 is the Azure DevOps resource app.
          MARKETPLACE_TOKEN=$(az account get-access-token \
            --tenant "${VARS_AZDO_PUBLISH_TENANT_ID}" \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query accessToken -o tsv)
          # Masked before it is written anywhere -- including $GITHUB_OUTPUT,
          # which is how it reaches the next step's `with:` input. Masking
          # redacts LOG output; the value itself flows to the composite
          # action the same way any secret input does (an INPUT_* env var the
          # runner sets, never a shell interpolation), so this does not
          # reopen the argv exposure the retry step avoids.
          echo "::add-mask::$MARKETPLACE_TOKEN"
          echo "token=$MARKETPLACE_TOKEN" >> "$GITHUB_OUTPUT"
        env:
          VARS_AZDO_PUBLISH_TENANT_ID: ${{ vars.AZDO_PUBLISH_TENANT_ID }}
      - name: Publish extension with a Microsoft Entra token
        # Feeds the token to tfx on stdin (never argv -- CWE-214) and retries a
        # transient upstream failure a bounded number of times; a deterministic
        # rejection (bad manifest, auth failure, duplicate version on the first
        # attempt) is never retried. Formerly this repo's own
        # scripts/publish-marketplace.js, now shared with azure-pipelines-packer
        # and azure-pipelines-release-docs so a fix lands in all three the next
        # time each bumps this pin, rather than needing three separate PRs the
        # way v1.15.2's fix did.
        uses: 4cloudguru/shared-workflows/.github/actions/publish-marketplace@450841eb41e83ae6d0b0a3ee20d1217b2887391b # v1.20.0
        with:
          vsix-path: ${{ steps.mint-token.outputs.vsix-file }}
          marketplace-token: ${{ steps.mint-token.outputs.token }}

  undraft-release:
    name: Undraft GitHub Release
    needs: [draft-release, publish-marketplace]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # hardening-exception: egress-audit — this job calls the GitHub API;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Undraft the release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ needs.draft-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false
            });
