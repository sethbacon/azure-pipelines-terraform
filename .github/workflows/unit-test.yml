---
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        description: >-
          Commit SHA or ref to check out (defaults to github.sha when
          omitted). Lets a caller (e.g. release.yml's guard-validated
          release pipeline) pin every job in this reusable workflow to an
          exact commit instead of a mutable tag/branch name (#485).
        required: false
        type: string

permissions:
  contents: read

jobs:
  check-versions:
    name: Check Version Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # hardening-exception: egress-audit — this job clones this repository;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          # Task versions are compared against the SAME task at the base
          # revision, which needs the base commit to be in the object store. A
          # shallow checkout has only the merge commit, so `git show
          # <base>:Tasks/.../task.json` would fail and check-versions.js fails
          # closed rather than skipping the comparison.
          fetch-depth: 0
      - name: Validate version fields
        env:
          # On a pull_request the checkout is the merge ref and origin/main is
          # not fetched, so name the base explicitly; on a push it is the commit
          # main was at before. check-versions.js falls back to origin/main then
          # HEAD^ and FAILS if none resolves while tasks exist.
          BASE_REV: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-versions.js
      - name: Validate task list consistency
        run: node scripts/check-task-list.js
      - name: Validate WIF audience parity across the setup guides
        run: node scripts/check-wif-audience-parity.js
      - name: Self-test check-versions.js
        run: node scripts/test-check-versions.js
      - name: Self-test check-minor-bumps.js
        run: node scripts/test-check-minor-bumps.js
      - name: Self-test bump-minor-versions.js
        run: node scripts/test-bump-minor-versions.js
      - name: Self-test check-task-list.js
        run: node scripts/test-check-task-list.js
      - name: Self-test check-per-file-coverage.js
        run: node scripts/test-check-per-file-coverage.js
      - name: Self-test publish-marketplace.js
        run: node scripts/test-publish-marketplace.js
      - name: Self-test for-each-task.js
        # Through `npm run`, deliberately, unlike its neighbours: npmCli()
        # resolves the child npm from npm_execpath, which only an `npm run`
        # parent sets. A bare `node scripts/test-for-each-task.js` would
        # exercise the fallback branch rather than the path every real
        # invocation of the runner takes.
        run: npm run test:task-runner
      - name: Check for mojibake encoding corruption
        shell: bash
        # Catches recurrence of the UTF-8-decoded-as-Windows-1252 corruption
        # fixed in azure-devops-extension.json, where a plain em dash had
        # been mis-decoded into three separate replacement characters, by
        # scanning the whole repo for the same byte signature.
        run: |
          set -uo pipefail
          if grep -rIl --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=build $'\xc3\xa2\xe2\x82\xac' .; then
            echo "::error::Mojibake encoding corruption found in the file(s) listed above (UTF-8 text mis-decoded as Windows-1252, then re-saved as UTF-8). Re-save as UTF-8 and replace the corrupted bytes with the intended character (e.g. a plain em dash)." >&2
            exit 1
          fi
          echo "No mojibake encoding corruption found."

  check-shared-modules:
    name: Check Shared Module Parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # hardening-exception: egress-audit — this job clones this repository;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Validate shared installer modules are identical
        run: node scripts/check-shared-modules.js
      - name: Self-test check-shared-modules.js
        run: node scripts/test-check-shared-modules.js
      - name: Check for unregistered near-duplicate modules
        run: node scripts/check-near-duplicate-modules.js
      - name: Validate egress authorization (SSRF class signature)
        run: node scripts/check-egress-authorization.js
      - name: Validate enforced disciplines (documented-but-unenforced class signature)
        run: node scripts/check-enforced-disciplines.js
      - name: Self-test check-enforced-disciplines.js
        run: node scripts/test-check-enforced-disciplines.js
      # check-proxy-parity has been wrong twice -- once reporting no call sites
      # for a task that makes them, once attributing a locally defined function
      # to a package by name alone. Both changed the inventory silently, which
      # is the one failure a coverage gate must not have.
      - name: Self-test check-proxy-parity.js
        run: node scripts/test-check-proxy-parity.js
      - name: Validate outbound proxy parity (sibling packer #196 class signature)
        run: node scripts/check-proxy-parity.js
      - name: Validate documented claims against the code
        run: node scripts/check-docs-claims.js

  build-and-test-v5:
    name: Build and Test V5 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    defaults:
      run:
        working-directory: Tasks/TerraformTask/TerraformTaskV5
    steps:
      # hardening-exception: egress-audit — this job installs from the npm registry,
      #   transfers artifacts through the Actions API, and clones this repository;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            $logFile = Join-Path $env:RUNNER_TEMP "npm-audit-prod-$attempt.log"
            & npm audit --omit=dev --audit-level=high 2>&1 | Tee-Object -FilePath $logFile
            $exitCode = $LASTEXITCODE
            $outputText = Get-Content -Path $logFile -Raw

            if ($exitCode -eq 0) {
              break
            }

            $transientNetworkFailure =
              $outputText -match 'audit.*network.*(timeout|timed out)' -or
              $outputText -match 'ECONNRESET|ETIMEDOUT|EAI_AGAIN|ENOTFOUND|ECONNREFUSED'

            if ($transientNetworkFailure -and $attempt -lt $maxAttempts) {
              Start-Sleep -Seconds (5 * $attempt)
              continue
            }

            exit $exitCode
          }
      # --omit=dev above only audits this task's production dependencies. Its
      # devDependencies (eslint, mocha, ts-node, nyc, ...) execute real code in
      # the Lint/Compile/Test steps below the same as a production dependency
      # would, so they need the same gate (issue #753): a second, deliberately
      # overlapping audit with no --omit=dev, repeated identically in every
      # build-and-test-* job in this file.
      - name: Audit development dependencies
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            $logFile = Join-Path $env:RUNNER_TEMP "npm-audit-dev-$attempt.log"
            & npm audit --audit-level=high 2>&1 | Tee-Object -FilePath $logFile
            $exitCode = $LASTEXITCODE
            $outputText = Get-Content -Path $logFile -Raw

            if ($exitCode -eq 0) {
              break
            }

            $transientNetworkFailure =
              $outputText -match 'audit.*network.*(timeout|timed out)' -or
              $outputText -match 'ECONNRESET|ETIMEDOUT|EAI_AGAIN|ENOTFOUND|ECONNREFUSED'

            if ($transientNetworkFailure -and $attempt -lt $maxAttempts) {
              Start-Sleep -Seconds (5 * $attempt)
              continue
            }

            exit $exitCode
          }
      - name: Lint
        run: npx --no-install eslint src/ Tests/
      - name: Compile TypeScript
        run: npm run compile
      - name: Run unit tests with coverage
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-terraform-task-v5-${{ matrix.os }}
          path: Tasks/TerraformTask/TerraformTaskV5/coverage/
          retention-days: 7
      # Every task.json in this repo declares a Node20_1 execution handler
      # alongside Node24 (see CLAUDE.md's task.json Schema Key Points) so older
      # on-prem/air-gapped agents without the Node 24 runner can still invoke
      # these tasks in production -- but until now nothing in CI ever ran
      # under Node 20, so a Node-20-incompatible change would ship invisible
      # (issue #654 named only this task and Provider Mirror V1; auditing the
      # rest of task.json/task.json shows all 11 declare the same handler, so
      # this step is repeated identically in every build-and-test-* job
      # below). Every step above runs under Node 24 (ts-node/mocha need it);
      # this re-points the runner's `node` at 20 and exercises the
      # ALREADY-COMPILED src/index.js the Node20_1 handler targets. With no
      # ADO input environment variables present, index.ts's own try/catch
      # always converts the resulting "input required" error into a caught
      # tasks.setResult(Failed, ...) and the process exits 0 (verified
      # locally, every task follows the same run()/try-catch/void run()
      # idiom) -- so the exit code alone is a reliable signal: zero means
      # Node 20 loaded and ran the compiled module graph successfully,
      # non-zero means a real incompatibility (e.g. a parse-time syntax error)
      # surfaced before that catch could run.
      - name: Set up Node 20 for Node20_1 handler smoke test
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
      - name: Verify compiled output runs under Node 20 (Node20_1 handler)
        run: node src/index.js
      # The smoke check above only proves the compiled module graph loads
      # under Node 20 -- with no ADO inputs, the task's own try/catch always
      # short-circuits into a caught failure before any real command,
      # credential, or verification logic executes (issue #720). This task is
      # the single most security-critical one in the repo (multi-cloud WIF/
      # OIDC token exchange, GPG/cosign verification, TLS transports), so run
      # the REAL, input-populated mocha assertion suite under Node 20 too, not
      # just a load-only check -- closing the behavioral-parity gap for the
      # highest-value component. mocha, nyc and typescript's own package.json
      # `engines` fields all explicitly support Node 20 (this task's own
      # `engines: >=24` only describes the officially-supported contributor
      # baseline; it doesn't block `npm run` against already-installed
      # node_modules), so this is expected to behave identically to the Node
      # 24 run above -- if it doesn't, that is exactly the Node-20-specific
      # divergence this issue exists to catch. The other 10 tasks keep only
      # the cheaper load-only smoke check above (issue #720's own agreed
      # scope); this additional real-test step is deliberately scoped to
      # TerraformTaskV5 only, to avoid materially increasing CI time
      # across every task.
      - name: Run real unit tests under Node 20 (#720)
        run: npm test

  # Real-terraform behavioral smoke harness (#719). Kept as a SEPARATE job from
  # build-and-test-v5 above (not folded into test:coverage) so the normal mock
  # suite stays terraform-free and fast, and local devs without terraform on
  # PATH still run it. See docs/initiatives/smoke-fuzz-testing-plan.md
  # Workstream 1 for the full design/rationale, and
  # Tests/SmokeL0.ts/Tests/SmokeTests/** for the scenarios themselves.
  build-and-test-v5-smoke:
    name: Build and Test V5 Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    defaults:
      run:
        working-directory: Tasks/TerraformTask/TerraformTaskV5
    steps:
      # hardening-exception: egress-audit — this job installs from the npm registry
      #   and clones this repository; harden-runner has never run in this repository,
      #   so no endpoint baseline exists and a block policy written without one fails
      #   closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.7"
          terraform_wrapper: false
      - name: Run real-terraform smoke tests
        run: npm run test:smoke

  # Stable required-status-check context for the V5 smoke matrix, mirroring
  # build-and-test-tab-gate's identical rationale: branch protection pins a
  # bare context, but an OS matrix job only reports OS-suffixed contexts.
  build-and-test-v5-smoke-gate:
    name: Build and Test V5 Smoke
    needs: build-and-test-v5-smoke
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # hardening-exception: egress-audit — runs only shell against the checkout, so
      #   its egress is already minimal, but harden-runner has never run in this
      #   repository, so no endpoint baseline exists and a block policy written
      #   without one fails closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Verify all V5 smoke matrix legs passed
        if: needs.build-and-test-v5-smoke.result != 'success'
        run: exit 1

  build-and-test-installer-v1:
