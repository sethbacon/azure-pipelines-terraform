  build-and-test-tab:
    name: Build and Test Tab (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    steps:
      # hardening-exception: egress-audit — this job installs from the npm registry,
      #   transfers artifacts through the Actions API, and clones this repository;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Audit root tooling (tfx-cli, webpack, cyclonedx-npm, jest, …)
        # The root package.json has no "dependencies" — everything here
        # (tfx-cli used by the marketplace publish job, webpack, cyclonedx-npm,
        # jest, …) is a devDependency, so --omit=dev (used by the per-task
        # audits below) would audit nothing. This is the one CI job that
        # installs the root toolchain, so it is the natural place to gate it.
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            $logFile = Join-Path $env:RUNNER_TEMP "npm-audit-tooling-$attempt.log"
            & npm audit --audit-level=high 2>&1 | Tee-Object -FilePath $logFile
            $exitCode = $LASTEXITCODE
            $outputText = Get-Content -Path $logFile -Raw

            if ($exitCode -eq 0) {
              break
            }

            $transientNetworkFailure =
              $outputText -match 'audit.*network.*(timeout|timed out)' -or
              $outputText -match 'ECONNRESET|ETIMEDOUT|EAI_AGAIN|ENOTFOUND|ECONNREFUSED'

            if ($transientNetworkFailure -and $attempt -lt $maxAttempts) {
              Start-Sleep -Seconds (5 * $attempt)
              continue
            }

            exit $exitCode
          }
      - name: Type-check tab
        run: npx --no-install tsc -p src/tab/tsconfig.json --noEmit
      - name: Run tab unit tests
        run: npm run test:tab
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-tab-${{ matrix.os }}
          path: coverage/
          retention-days: 7

  # Stable required-status-check context for the Tab tests. Branch protection
  # on main pins the bare "Build and Test Tab" context, but the matrix job
  # above only reports the OS-suffixed "Build and Test Tab (ubuntu-latest)" /
  # "Build and Test Tab (windows-2025)" contexts. This gate re-exposes the
  # pinned context — succeeding only when every matrix leg passed — so the OS
  # matrix (issue #512) can be added without orphaning the required check,
  # which would otherwise stay perpetually "Expected" and block every future
  # PR into main until branch protection is repointed. No branch-protection
  # change is needed on merge as a result.
  build-and-test-tab-gate:
    name: Build and Test Tab
    needs: build-and-test-tab
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # hardening-exception: egress-audit — runs only shell against the checkout, so
      #   its egress is already minimal, but harden-runner has never run in this
      #   repository, so no endpoint baseline exists and a block policy written
      #   without one fails closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Verify all Tab matrix legs passed
        if: needs.build-and-test-tab.result != 'success'
        run: exit 1

  # Both linters come from the shared definition rather than being maintained
  # here. The local pair scanned `.github/workflows/` only, so zizmor's
  # dependabot-cooldown audit never saw dependabot.yml and reported nothing --
  # not because there was nothing to report. The shared job scans the repository.
  workflow-security:
    name: Workflow Security
    uses: 4cloudguru/shared-workflows/.github/workflows/workflow-security.yml@a53b685c1f50255e5bc7061b6080d2456351b9be # v1.18.0
    with:
      # release.yml calls this workflow at the commit it is about to publish;
      # the linters have to read that commit, not the run's default.
      ref: ${{ inputs.ref || github.sha }}

  # Recorded ALONGSIDE the gate above, never instead of it. workflow-security.yml
  # runs zizmor with advanced-security: false, where its exit code stands and a
  # finding fails the job; this one runs the same scanner with sarif, where zizmor
  # EXITS 0 WHATEVER IT FINDS and the job's purpose is to upload. Together:
  # findings block the pull request AND persist in the security tab, where one can
  # be dismissed with a reason that outlives the run. Before this, findings here
  # blocked and left no record (4cloudguru/shared-workflows#25).
  #
  # The permission is granted at this `uses:` site because that is the only place
  # it can be: a called workflow cannot raise its own ceiling. Every caller of THIS
  # file must grant it too -- see release.yml and weekly-security.yml -- because a
  # job requesting more than its caller allows is a startup failure that produces
  # NO JOBS, so it cannot fail a required check either. The context simply never
  # appears, which is indistinguishable from one still running
  # (4cloudguru/shared-workflows#19).
  workflow-security-record:
    name: Workflow Security Record
    permissions:
      contents: read
      security-events: write
    uses: 4cloudguru/shared-workflows/.github/workflows/workflow-security-record.yml@a53b685c1f50255e5bc7061b6080d2456351b9be # v1.18.0

